name: RealWorld identity database diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-manual-applications
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      TZ: UTC
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/study-artifacts" "$RUNNER_TEMP/study-runtime"
          printf 'CI_ARTIFACT_DIR=%s\nSTUDY_RUNTIME=%s\n' "$RUNNER_TEMP/study-artifacts" "$RUNNER_TEMP/study-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare pinned backend
        timeout-minutes: 6
        run: python scripts/ci/prepare_realworld_diagnostic.py --runtime "$STUDY_RUNTIME/realworld" --report "$CI_ARTIFACT_DIR/diagnostic-bootstrap.json" 2>&1 | tee "$CI_ARTIFACT_DIR/application-bootstrap.log"
      - name: Execute and reconstruct database diagnostic
        timeout-minutes: 9
        run: |
          timeout --signal=TERM --kill-after=20s 480s python scripts/run_realworld_identity_database_diagnostic.py 2>&1 | tee "$CI_ARTIFACT_DIR/application-run.log"
          python scripts/validate_realworld_identity_database_diagnostic.py "$CI_ARTIFACT_DIR/identity-database-diagnostic"
      - name: Retain every attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realworld-identity-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/study-artifacts/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

name: Iris write-preservation component calibration v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-manual-applications
  cancel-in-progress: false
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      requirements: ${{ steps.freeze.outputs.requirements }}
      lock_sha256: ${{ steps.freeze.outputs.lock_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cgbarlow/iris
          ref: a02a45480b8f801f5d5eab8c3da19d131cd3ed7c
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - name: Resolve one shared environment
        run: |
          mkdir -p "$RUNNER_TEMP/iris-environment"
          python -m pip install ./backend ./iris-client ./mcp jsonschema==4.23.0 > "$RUNNER_TEMP/iris-environment/install.log" 2>&1
      - name: Freeze dependency versions before execution
        id: freeze
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, re, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'iris-environment'
          raw = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze', '--all'], text=True)
          (root / 'full-freeze.txt').write_text(raw)
          selected = []
          for line in raw.splitlines():
              name = re.split(r'==| @ ', line, maxsplit=1)[0].lower().replace('_', '-')
              if name in {'iris-backend', 'iris-client', 'iris-mcp'}:
                  continue
              assert re.fullmatch(r'[A-Za-z0-9_.-]+==[^ ]+', line), line
              selected.append(line)
          value = ('\n'.join(sorted(selected)) + '\n').encode()
          (root / 'requirements.txt').write_bytes(value)
          (root / 'python.txt').write_text(sys.version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('requirements=' + base64.b64encode(value).decode() + '\n')
              stream.write('lock_sha256=' + hashlib.sha256(value).hexdigest() + '\n')
          PY
      - name: Retain environment attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iris-write-environment-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iris-environment/
          retention-days: 7
          if-no-files-found: error
  calibration:
    needs: environment
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cell: [old_old, old_fixed, fixed_old, fixed_fixed]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      STUDY_CELL: ${{ matrix.cell }}
      STUDY_LOCK_B64: ${{ needs.environment.outputs.requirements }}
      STUDY_LOCK_SHA256: ${{ needs.environment.outputs.lock_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cgbarlow/iris
          ref: a02a45480b8f801f5d5eab8c3da19d131cd3ed7c
          path: upstream-iris
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cgbarlow/iris
          ref: ebba6c1036e86cac407c2614e41c2039ac56c8f7
          path: upstream-iris-fixed
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - name: Install shared frozen dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/iris-install"
          python - <<'PY'
          import base64, hashlib, os, pathlib
          value = base64.b64decode(os.environ['STUDY_LOCK_B64'], validate=True)
          assert hashlib.sha256(value).hexdigest() == os.environ['STUDY_LOCK_SHA256']
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'iris-install/requirements.txt').write_bytes(value)
          PY
          python -m pip install --no-deps -r "$RUNNER_TEMP/iris-install/requirements.txt" > "$RUNNER_TEMP/iris-install/install.log" 2>&1
      - name: Execute frozen component cell
        run: python scripts/extension/run_iris_write_preservation_v1.py --cell "$STUDY_CELL" --source upstream-iris --fixed upstream-iris-fixed --lock "$RUNNER_TEMP/iris-install/requirements.txt" --output "$RUNNER_TEMP/iris-calibration"
      - name: Retain cell attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iris-write-calibration-v1-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/iris-calibration/
            ${{ runner.temp }}/iris-install/
          retention-days: 7
          if-no-files-found: error

name: Quartz provider recovery v1
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: initial
        options: [initial, repeat2, repeat3]
      batch:
        type: string
        required: true
        default: all
permissions:
  contents: read
concurrency:
  group: study-manual-applications
  cancel-in-progress: false
jobs:
  selection:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - id: select
        env:
          MODE: ${{ inputs.mode }}
          BATCH: ${{ inputs.batch }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: |
          matrix=$(python scripts/quartz_recovery_matrix_v1.py --mode "$MODE" --batch "$BATCH")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  application:
    needs: selection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      TZ: UTC
      MODE: ${{ inputs.mode }}
      BATCH: ${{ matrix.batch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize evidence
        run: |
          mkdir -p "$RUNNER_TEMP/study-artifacts" "$RUNNER_TEMP/study-runtime"
          printf 'CI_ARTIFACT_DIR=%s\nSTUDY_RUNTIME=%s\n' "$RUNNER_TEMP/study-artifacts" "$RUNNER_TEMP/study-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        if: ${{ matrix.app != 'realworld' }}
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache-jdk: false
          overwrite-settings: false
      - name: Record requested unit
        run: |
          python - <<'PYTHON'
          import os,json
          from pathlib import Path
          Path(os.environ['CI_ARTIFACT_DIR'],'requested-unit.json').write_text(json.dumps({'mode':os.environ['MODE'],'batch':os.environ['BATCH'],'source_commit':os.environ['GITHUB_SHA'],'run_identity':os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT']},indent=2)+'\n')
          PYTHON
      - name: Record runtime versions
        run: python scripts/ci/capture_versions.py --output "$CI_ARTIFACT_DIR/runtime-versions.json"
      - name: Install pinned browser
        timeout-minutes: 4
        run: bash scripts/ci/install_browser.sh 2>&1 | tee "$CI_ARTIFACT_DIR/browser-install.log"
      - name: Prepare RealWorld
        if: ${{ matrix.app == 'realworld' }}
        timeout-minutes: 6
        run: python scripts/ci/prepare_realworld.py --runtime "$STUDY_RUNTIME/realworld" --node-tools "$RUNNER_TEMP/study-node-tools" --report "$CI_ARTIFACT_DIR/realworld-bootstrap.json" 2>&1 | tee "$CI_ARTIFACT_DIR/application-bootstrap.log"
      - name: Prepare PetClinic
        if: ${{ matrix.app == 'petclinic' }}
        timeout-minutes: 6
        run: python scripts/ci/prepare_petclinic.py 2>&1 | tee "$CI_ARTIFACT_DIR/application-bootstrap.log"
      - name: Prepare Quartz
        if: ${{ matrix.app == 'quartz' }}
        timeout-minutes: 6
        run: python scripts/ci/prepare_quartz.py --runtime "$STUDY_RUNTIME/quartz" --java "$JAVA_HOME/bin/java" --report "$CI_ARTIFACT_DIR/quartz-bootstrap.json" 2>&1 | tee "$CI_ARTIFACT_DIR/application-bootstrap.log"
      - name: Execute immutable unit
        timeout-minutes: 16
        run: timeout --signal=TERM --kill-after=20s 900s python scripts/run_quartz_recovery_unit_v1.py --mode "$MODE" --batch "$BATCH" 2>&1 | tee "$CI_ARTIFACT_DIR/application-run.log"
      - name: Independently reconstruct unit
        if: ${{ always() }}
        run: python scripts/validate_quartz_recovery_unit_v1.py "$CI_ARTIFACT_DIR/quartz-recovery-unit-v1" > "$CI_ARTIFACT_DIR/verification.json"
      - name: Retain every attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quartz-recovery-${{ inputs.mode }}-${{ matrix.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/study-artifacts/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

name: Pinned GitLab namespace authentication v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Qualify namespace access and same-actor authentication
        run: |
          mkdir -p "$RUNNER_TEMP/gitlab-auth-v2"
          git rev-parse HEAD > "$RUNNER_TEMP/gitlab-auth-v2/head.txt"
          bash scripts/extension/qualify_benchmark_gitlab_auth_runtime_v2.sh "$RUNNER_TEMP/gitlab-auth-v2"
      - name: Retain namespace authentication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitlab-auth-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/gitlab-auth-v2/
          retention-days: 30

name: Vibe per-test transition pilot v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-manual-applications
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        level: [L0, L4]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      STUDY_LEVEL: ${{ matrix.level }}
    steps:
      - name: Initialize evidence
        run: mkdir -p "$RUNNER_TEMP/vibe-evidence"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned replay dependencies
        run: |
          set -o pipefail
          python -m pip install fastapi==0.115.0 uvicorn==0.30.6 sqlalchemy==2.0.35 pydantic==2.9.2 pytest==8.3.3 requests==2.32.3 pyyaml==6.0.2 python-multipart==0.0.9 Pillow==11.0.0 2>&1 | tee "$RUNNER_TEMP/vibe-evidence/dependencies.log"
          python -m pip freeze > "$RUNNER_TEMP/vibe-evidence/pip-freeze.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/vibe-evidence/study-head.txt"
          sha256sum scripts/extension/run_vibe_per_test_pilot_v1.py scripts/extension/vibe_trace_plugin_v1.py > "$RUNNER_TEMP/vibe-evidence/instrument-sha256.txt"
      - name: Replay frozen suites and original controls
        run: python scripts/extension/run_vibe_per_test_pilot_v1.py --level "$STUDY_LEVEL" --output "$RUNNER_TEMP/vibe-evidence"
      - name: Preserve evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vibe-per-test-${{ matrix.level }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vibe-evidence/
          retention-days: 7
          if-no-files-found: error

name: Catalog Nginx ordinary qualification v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-nginx-qualification
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20.20.2'
          package-manager-cache: false
      - name: Verify published preparation
        run: python3 scripts/prepare_evaluation.py --verify
      - name: Authenticate original image pulls
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Execute one registered bounded qualification attempt
        run: timeout --signal=TERM --kill-after=20s 1620s python3 scripts/extension/qualify_nginx_ordinary_v1.py --workspace "$RUNNER_TEMP/nginx-qualification-v1"
      - name: Cleanup dedicated resources
        if: ${{ always() }}
        run: |
          docker rm -f study-nginx-ordinary study-nginx-browser study-nginx-builder study-nginx-frontend-inventory study-nginx-package-inventory study-nginx-backend-inventory study-nginx-checkpoint-database || true
          docker network rm study-nginx-isolated || true
          docker logout || true
      - name: Retain only public summary and encrypted evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog-nginx-ordinary-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/nginx-qualification-v1/public/
          retention-days: 7
          if-no-files-found: warn

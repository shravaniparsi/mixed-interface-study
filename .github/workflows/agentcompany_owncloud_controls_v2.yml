name: Workplace ownCloud ordinary controls v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workplace-owncloud-ordinary-v2
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20.20.2'
          package-manager-cache: false
      - name: Install pinned browser tooling and map benchmark hostname
        run: |
          mkdir -p "$RUNNER_TEMP/owncloud-ordinary-v2"
          export CI_ARTIFACT_DIR="$RUNNER_TEMP/owncloud-ordinary-v2"
          timeout 5m bash scripts/ci/install_browser.sh
          echo '127.0.0.1 the-agent-company.com' | sudo tee -a /etc/hosts
      - name: Verify task content and execute three fresh ordinary paths
        run: |
          python3 scripts/extension/prepare_agentcompany_owncloud_control_v1.py --verify
          timeout 35m python3 scripts/extension/run_agentcompany_owncloud_controls_v2.py "$RUNNER_TEMP/owncloud-ordinary-v2"
      - name: Assess qualification without relabeling failures as defects
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/owncloud-ordinary-v2/runtime.json" ]; then
            python3 scripts/extension/score_agentcompany_owncloud_controls_v2.py --archive "$RUNNER_TEMP/owncloud-ordinary-v2" > "$RUNNER_TEMP/owncloud-ordinary-v2/qualification.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owncloud-ordinary-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/owncloud-ordinary-v2
          if-no-files-found: error
          retention-days: 30

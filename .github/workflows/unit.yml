name: Unit checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize evidence directory
        run: |
          ci_artifact_dir="$RUNNER_TEMP/study-artifacts"
          mkdir -p "$ci_artifact_dir"
          printf '%s\n' 'Automatic unit checks; no applications started.' > "$ci_artifact_dir/scope.txt"
          printf 'CI_ARTIFACT_DIR=%s\n' "$ci_artifact_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Record runtime versions
        run: python scripts/ci/capture_versions.py --output "$CI_ARTIFACT_DIR/runtime-versions.json"
      - name: Python harness tests
        run: python -m unittest discover -s tests -v 2>&1 | tee "$CI_ARTIFACT_DIR/python-tests.log"
      - name: Bootstrap helper tests
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v 2>&1 | tee "$CI_ARTIFACT_DIR/bootstrap-tests.log"
      - name: Verify evaluation preparation provenance
        run: python scripts/prepare_evaluation.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/evaluation-preparation.log"
      - name: Verify unified control analysis
        run: python scripts/build_control_analysis.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/unified-control-analysis.log"
      - name: Verify normalization control audit
        run: python scripts/audit_normalization_controls.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/normalization-controls.log"
      - name: Verify prospective RealWorld component analysis
        run: python scripts/summarize_realworld_paired_components.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-paired-components.log"
      - name: Replay RealWorld terminal classification
        run: python scripts/realworld_terminal_outcomes.py results/realworld-paired-controls-ci-20261107 > "$CI_ARTIFACT_DIR/realworld-terminal-replay.json"
      - name: Verify Quartz repeat-policy planning
        run: python scripts/prepare_quartz_repeat_policy.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/quartz-repeat-policy.log"
      - name: Verify Quartz terminal integration archive
        run: python scripts/verify_quartz_terminal_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/quartz-terminal-archive.log"
      - name: Verify RealWorld terminal integration archive
        run: python scripts/verify_realworld_terminal_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-terminal-archive.log"
      - name: Verify expanded RealWorld integration archive
        run: python scripts/verify_realworld_expanded_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-expanded-archive.log"
      - name: Verify RealWorld rejection integration archive
        run: python scripts/verify_realworld_rejection_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-rejection-archive.log"
      - name: Verify PetClinic terminal extraction replay
        run: python scripts/prepare_petclinic_terminal.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/petclinic-terminal-replay.log"
      - name: Verify PetClinic terminal integration archive
        run: python scripts/verify_petclinic_terminal_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/petclinic-terminal-archive.log"
      - name: Verify PetClinic prefix interpretation preparation
        run: python scripts/prepare_petclinic_prefix_v3.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/petclinic-prefix-v3.log"
      - name: Verify expanded PetClinic integration archive
        run: python scripts/verify_petclinic_expanded_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/petclinic-expanded-archive.log"
      - name: Verify RealWorld field integration archive
        run: python scripts/verify_realworld_field_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-field-archive.log"
      - name: Verify halted RealWorld identity archive
        run: python scripts/verify_realworld_identity_halted_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-identity-halted-archive.log"
      - name: Verify RealWorld identity database archive
        run: python scripts/verify_realworld_identity_database_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-identity-database-archive.log"
      - name: Replay separate write observations
        run: python scripts/replay_write_observations.py > "$CI_ARTIFACT_DIR/write-observations.json"
      - name: Replay paired identity measurements
        run: python scripts/replay_identity_measurements_v2.py > "$CI_ARTIFACT_DIR/identity-measurements-v2.json"
      - name: Verify live paired database archive
        run: python scripts/verify_realworld_paired_database_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/paired-database-archive.log"
      - name: Verify isolated article database archive
        run: python scripts/verify_realworld_article_database_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-article-database.log"
      - name: Verify live reference comparison runtime archive
        run: python scripts/verify_realworld_reference_runtime_v10.py 2>&1 | tee "$CI_ARTIFACT_DIR/reference-runtime-v10.log"
      - name: Verify prospective reference terminal integration
        run: python scripts/prepare_realworld_reference_integration_v2.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/reference-integration-v2.log"
      - name: Replay generated-reference comparison
        run: python scripts/replay_realworld_references_v1.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-reference-replay.log"
      - name: Verify fresh legacy v9 archive
        run: python scripts/verify_realworld_fresh_legacy_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-fresh-legacy.log"
      - name: Verify halted legacy v8 archive
        run: python scripts/verify_realworld_legacy_halted_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-legacy-halted.log"
      - name: Verify retained corpus bindings
        run: python scripts/prepare_corpus_coverage.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/corpus-coverage.log"
      - name: Verify generated mutation preparation
        run: python scripts/prepare_realworld_generated_mutations_v3.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-generated-mutations.log"
      - name: Verify live generated mutation archive
        run: python scripts/verify_realworld_generated_mutations_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-generated-mutations-runtime.log"
      - name: Verify live generated reference archive
        run: python scripts/verify_realworld_generated_runtime_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-generated-runtime.log"
      - name: Verify offline generated RealWorld bindings
        run: python scripts/prepare_realworld_generated_bindings_v1.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-generated-bindings.log"
      - name: Verify legacy and database readiness reconciliation
        run: python scripts/prepare_corpus_review_v3.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/corpus-review-v3.log"
      - name: Verify live reference readiness reconciliation
        run: python scripts/prepare_corpus_review_v5.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/corpus-review-v5.log"
      - name: Verify never-started correction jobs and partial evidence
        run: python scripts/retain_quartz_provider_failure_v1.py --verify
      - name: Verify completion and analysis of original diagnostic collection
        run: python scripts/verify_primary_results_v1.py
      - name: Verify completion of all registered experiments
        run: python scripts/build_experiment_completion_v3.py --verify
      - name: Verify public host qualification and recovery preparation
        run: |
          python scripts/verify_quartz_public_qualification_freeze_v1.py
          python -c "import sys; sys.path.insert(0,'scripts'); from verify_quartz_recovery_release_v2 import preparation_verified; print('Public recovery units:',len(preparation_verified()['plan']['initial_batches']))"
      - name: Verify corrected Quartz reader qualification
        run: python scripts/verify_quartz_correction_freeze_v1.py
      - name: Verify complete second primary repetition
        run: python scripts/verify_primary_collection_v1.py manifests/primary-repeat2-runtime-v1.json
      - name: Verify complete initial primary collection
        run: python scripts/verify_primary_collection_v1.py manifests/primary-initial-runtime-v1.json
      - name: Verify primary freeze and clean smoke
        run: python scripts/verify_primary_freeze_v1.py
      - name: Retain first primary smoke failure
        run: python scripts/verify_primary_smoke_attempt1.py
      - name: Verify live common generated archive
        run: python scripts/verify_common_generated_archive_v1.py 2>&1 | tee "$CI_ARTIFACT_DIR/common-generated-runtime-v1.log"
      - name: Verify live common executor archive
        run: python scripts/verify_common_petclinic_archive_v1.py 2>&1 | tee "$CI_ARTIFACT_DIR/common-executor-runtime-v1.log"
      - name: Verify common engineering bindings
        run: python scripts/prepare_common_bindings_v1.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/common-bindings-v1.log"
      - name: Verify live PetClinic timing archive
        run: python scripts/verify_petclinic_timing_archive_v1.py 2>&1 | tee "$CI_ARTIFACT_DIR/petclinic-timing-runtime-v1.log"
      - name: Verify PetClinic branch-cost preparation
        run: python scripts/prepare_petclinic_branch_cost_v1.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/petclinic-branch-cost-v1.log"
      - name: Verify generated corpus readiness reconciliation
        run: python scripts/prepare_corpus_review_v4.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/corpus-review-v4.log"
      - name: Verify reconciled corpus readiness
        run: python scripts/prepare_corpus_review_v2.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/corpus-review-v2.log"
      - name: Reconstruct complete independent-input evidence
        run: python scripts/extension/build_independent_input_summary_v1.py --verify
      - name: Verify independent-input exposure and denominator audit
        run: python scripts/extension/build_independent_goal_audit_v1.py --verify
      - name: Reconstruct historical write-preservation calibration
        run: |
          python -m pip install jsonschema==4.23.0
          python scripts/extension/verify_write_preservation_calibration_v2.py --archive results/write-preservation-calibration-v2-ci-43079843246 --verify manifests/write-preservation-calibration-results-v2.json
      - name: Reconstruct Iris component effects and accounting
        run: |
          python scripts/extension/verify_iris_write_preservation_v1.py --archive results/iris-write-calibration-v1-ci-43082290147 --verify manifests/iris-write-preservation-results-v1.json
          python scripts/extension/build_iris_write_cost_v1.py --verify
      - name: Verify common write-frame development export
        run: python scripts/extension/build_write_frame_development_v1.py --verify
      - name: Verify unqualified Vikunja attempts and cost
        run: |
          python scripts/extension/verify_vikunja_bulk_exclusion_v1.py --verify
          python scripts/extension/build_vikunja_bulk_cost_v1.py --verify
      - name: Reconstruct Fast Dash cascade discrepancy
        run: |
          python scripts/extension/verify_fastdash_cascade_v2.py --archive results/fastdash-cascade-v1-ci-43088065630 --verify manifests/fastdash-cascade-results-v2.json
          python scripts/extension/build_fastdash_cascade_cost_v1.py --verify
      - name: Independently validate frozen OpenAPI source inputs
        run: |
          python -m venv "$RUNNER_TEMP/adapter-schema-validator"
          "$RUNNER_TEMP/adapter-schema-validator/bin/python" -m pip install --disable-pip-version-check -r evidence/openapi-adapter-inputs-v1/validation-requirements.txt
          "$RUNNER_TEMP/adapter-schema-validator/bin/python" scripts/extension/validate_adapter_inputs_v1.py --verify
      - name: Reconstruct GitLab namespace authentication
        run: python scripts/extension/verify_benchmark_gitlab_auth_v2.py --archive results/benchmark-gitlab-auth-v2-ci-43172360473 --verify
      - name: Reconstruct GitLab connectivity diagnosis
        run: python scripts/extension/verify_benchmark_gitlab_connectivity_v1.py --archive results/benchmark-gitlab-connectivity-v1-ci-43170995499 --verify
      - name: Reconstruct failed GitLab startup qualification
        run: python scripts/extension/verify_benchmark_gitlab_startup_v1.py --archive results/benchmark-gitlab-startup-v1-ci-43168226517 --verify
      - name: Reconstruct benchmark representative contexts
        run: python scripts/extension/build_benchmark_representative_context_v1.py --verify
      - name: Reconstruct source-derived GitLab input specifications
        run: python scripts/extension/build_benchmark_gitlab_inputs_v1.py --verify
      - name: Reconstruct pinned GitLab source inspection
        run: python scripts/extension/verify_gitlab_image_inspection_v1.py --archive results/benchmark-gitlab-image-inspection-v1-ci-43166622248 --verify
      - name: Verify benchmark capacity and image metadata evidence
        run: python scripts/extension/verify_benchmark_capacity_v1.py --verify
      - name: Verify benchmark-authored continuation candidate selection
        run: python scripts/extension/build_benchmark_continuation_selection_v1.py --verify
      - name: Verify frozen descriptive benchmark task screen
        run: python scripts/extension/screen_benchmark_task_intents_v1.py --verify
      - name: Verify missing-outcome audit and external sampling frame
        run: |
          python scripts/extension/build_missingness_audit_v1.py --verify
          python scripts/extension/build_benchmark_structure_screen_v1.py --verify
      - name: Reconstruct completed adapter comparison and cost
        run: python scripts/extension/build_adapter_results_v1.py --verify
      - name: Verify bounded adapter setup correction and initial archive
        run: |
          python scripts/extension/verify_adapter_correction_v2.py
          python scripts/extension/verify_adapter_comparison_archive_v1.py results/openapi-adapter-comparison-v1-ci-43163040718/adapter-prefect-43163040718-1/comparison
          python scripts/extension/verify_adapter_comparison_archive_v1.py results/openapi-adapter-comparison-v1-ci-43163040718/adapter-ivo-toby-43163040718-1/comparison
      - name: Verify frozen adapter comparison
        run: python scripts/extension/verify_adapter_execution_freeze_v1.py
      - name: Reconstruct reference backend calibration
        run: python scripts/extension/verify_adapter_reference_v1.py --verify
      - name: Verify independent converter input enumeration
        run: python scripts/extension/build_adapter_input_inventory_v1.py --verify
      - name: Verify information-matched configuration reference replay
        run: python scripts/extension/replay_netbox_information_reference_v1.py --verify
      - name: Reconstruct NetBox configuration calibration attempts
        run: |
          python scripts/extension/verify_netbox_config_defaults_v1.py --archive results/netbox-config-defaults-v1-ci-43156734009 --output manifests/netbox-config-defaults-attempt1-v1.json --verify
          python scripts/extension/verify_netbox_config_defaults_v1.py --corrected --archive results/netbox-config-defaults-v2-ci-43157153410 --output manifests/netbox-config-defaults-results-v2.json --verify
      - name: Verify independent Vibe archive and scoring audits
        run: |
          python scripts/extension/audit_vibe_released_v1.py --verify
          python scripts/extension/audit_vibe_mutation_source_v1.py --verify
          python scripts/extension/build_defects4rest_screen_v1.py --verify
          python scripts/extension/verify_vibe_per_test_pilot_v1.py --archive results/vibe-per-test-pilot-v1-ci-43152134972 --output manifests/vibe-per-test-pilot-results-v1.json --verify
      - name: Reconstruct final TestPlanIt exclusions and closed cohort
        run: |
          python scripts/extension/verify_testplanit_tags_v1.py --archive results/testplanit-tags-v1-ci-43090047548 --verify manifests/testplanit-tags-attempt1-v1.json
          python scripts/extension/verify_testplanit_tags_v1.py --archive results/testplanit-tags-v2-ci-43090747883 --verify manifests/testplanit-tags-attempt2-v1.json
          python scripts/extension/build_testplanit_tags_cost_v1.py --verify
          python scripts/extension/build_write_contract_disposition_v1.py --verify
      - name: Verify portable manual-contract replay
        run: |
          python scripts/extension/build_write_contract_replay_v1.py --verify
          python scripts/extension/build_contract_information_ablation_v1.py --verify
          PYTHONPATH=src python -m mixed_interface.write_contract manifests/write-contract-replay-v1.json --output "$CI_ARTIFACT_DIR/write-contract-replay.json"
          python -c 'import json,os; from pathlib import Path; assert json.loads((Path(os.environ["CI_ARTIFACT_DIR"])/"write-contract-replay.json").read_text())["scores"] == json.loads(Path("manifests/write-contract-replay-v1.json").read_text())["scores"]'
      - name: Verify candidate benchmark scoring qualification
        run: |
          python scripts/extension/verify_restestbench_scoring_probe_v1.py --verify
          python scripts/extension/audit_restestbench_released_status_v1.py --verify
          python scripts/extension/qualify_restestbench_applicability_v1.py --verify
          python scripts/extension/build_restestbench_generator_inputs_v1.py --verify
          python scripts/extension/build_restestbench_credit_sensitivity_v1.py --verify
          python scripts/extension/build_restestbench_mutant_identity_v1.py --verify
          python scripts/extension/verify_restestbench_mutant_runtime_v1.py --archive results/restestbench-mutant-runtime-v1-ci-43144135284 --output manifests/restestbench-mutant-runtime-results-v1.json --verify
          python scripts/extension/build_restestbench_assertion_analysis_v1.py --verify
          python scripts/extension/audit_restestbench_nestjs_unready_v1.py --verify
          python scripts/extension/audit_restestbench_nestjs_unready_v2.py --verify
          python scripts/extension/verify_restestbench_valid_golden_fresh_v1.py --archive results/restestbench-valid-golden-fresh-v1-ci-43133202268 --output manifests/restestbench-valid-golden-fresh-v1.json --verify
          python scripts/extension/verify_restestbench_nestjs_correction_v1.py --archive results/restestbench-nestjs-reset-correction-v1-ci-43134240767 --output manifests/restestbench-valid-golden-after-correction-v1.json --verify
          python scripts/extension/verify_restestbench_valid_golden_v1.py --archive results/restestbench-valid-golden-startup-v1 --output manifests/restestbench-valid-golden-startup-v1.json --verify
      - name: Pure Node adapter tests
        run: node --test tests/*.test.mjs 2>&1 | tee "$CI_ARTIFACT_DIR/node-tests.log"
      - name: Syntax checks
        run: |
          python -m compileall -q src scripts tests
          for file in scripts/*.mjs scripts/ci/*.mjs scripts/extension/*.mjs; do node --check "$file"; done
          for file in scripts/ci/*.sh; do bash -n "$file"; done
      - name: Retain unit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/study-artifacts/
          retention-days: 7
          if-no-files-found: warn

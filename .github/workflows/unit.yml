name: Unit checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize evidence directory
        run: |
          ci_artifact_dir="$RUNNER_TEMP/study-artifacts"
          mkdir -p "$ci_artifact_dir"
          printf '%s\n' 'Automatic unit checks; no applications started.' > "$ci_artifact_dir/scope.txt"
          printf 'CI_ARTIFACT_DIR=%s\n' "$ci_artifact_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Record runtime versions
        run: python scripts/ci/capture_versions.py --output "$CI_ARTIFACT_DIR/runtime-versions.json"
      - name: Python harness tests
        run: python -m unittest discover -s tests -v 2>&1 | tee "$CI_ARTIFACT_DIR/python-tests.log"
      - name: Bootstrap helper tests
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v 2>&1 | tee "$CI_ARTIFACT_DIR/bootstrap-tests.log"
      - name: Verify evaluation preparation provenance
        run: python scripts/prepare_evaluation.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/evaluation-preparation.log"
      - name: Verify unified control analysis
        run: python scripts/build_control_analysis.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/unified-control-analysis.log"
      - name: Verify normalization control audit
        run: python scripts/audit_normalization_controls.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/normalization-controls.log"
      - name: Verify prospective RealWorld component analysis
        run: python scripts/summarize_realworld_paired_components.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-paired-components.log"
      - name: Replay RealWorld terminal classification
        run: python scripts/realworld_terminal_outcomes.py results/realworld-paired-controls-ci-20261107 > "$CI_ARTIFACT_DIR/realworld-terminal-replay.json"
      - name: Verify Quartz repeat-policy planning
        run: python scripts/prepare_quartz_repeat_policy.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/quartz-repeat-policy.log"
      - name: Verify Quartz terminal integration archive
        run: python scripts/verify_quartz_terminal_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/quartz-terminal-archive.log"
      - name: Verify RealWorld terminal integration archive
        run: python scripts/verify_realworld_terminal_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-terminal-archive.log"
      - name: Verify expanded RealWorld integration archive
        run: python scripts/verify_realworld_expanded_archive.py 2>&1 | tee "$CI_ARTIFACT_DIR/realworld-expanded-archive.log"
      - name: Verify retained corpus bindings
        run: python scripts/prepare_corpus_coverage.py --verify 2>&1 | tee "$CI_ARTIFACT_DIR/corpus-coverage.log"
      - name: Pure Node adapter tests
        run: node --test tests/*.test.mjs 2>&1 | tee "$CI_ARTIFACT_DIR/node-tests.log"
      - name: Syntax checks
        run: |
          python -m compileall -q src scripts tests
          for file in scripts/*.mjs scripts/ci/*.mjs; do node --check "$file"; done
          for file in scripts/ci/*.sh; do bash -n "$file"; done
      - name: Retain unit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/study-artifacts/
          retention-days: 7
          if-no-files-found: warn

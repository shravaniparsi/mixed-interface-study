name: Reserved Booklore original source build v1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: booklore-app/booklore
          ref: 01b3407528a6ce00d064dbb9aa3f69b72d82641b
          path: subject
          persist-credentials: false
      - name: Pull fixed images then remove authentication
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/binaries"
          export DOCKER_CONFIG="$RUNNER_TEMP/study-docker-auth"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin > /dev/null 2>&1
          unset DOCKERHUB_TOKEN DOCKERHUB_USERNAME
          for image in node:24-alpine gradle:9.3.1-jdk25-alpine; do
            timeout 180 docker pull "$image" >> "$RUNNER_TEMP/evidence/image-pulls.log" 2>&1
          done
      - name: Build original embedded-UI JAR once
        run: python3 scripts/extension/build_reserved_booklore_v1.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: reserved-booklore-build-evidence-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/*
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: reserved-booklore-build-binaries-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/binaries/*
          retention-days: 7
          if-no-files-found: warn

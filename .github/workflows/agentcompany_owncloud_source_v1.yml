name: Workplace ownCloud packaged source v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workplace-owncloud-source-v1
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Copy fixed source files without starting the container
        run: python scripts/extension/inspect_agentcompany_owncloud_v1.py "$RUNNER_TEMP/owncloud-packaged-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owncloud-packaged-source-${{ github.run_id }}
          path: ${{ runner.temp }}/owncloud-packaged-source
          if-no-files-found: error
          retention-days: 30

name: Development specification dependency resolution v1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize evidence
        run: mkdir -p "$RUNNER_TEMP/spec-resolution-evidence"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mraible/21-points
          ref: 29f5a77069bee0163e3cfebbb6fd5969f23160a1
          path: application
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17.0.2+8'
      - name: Resolve original runtime dependency
        working-directory: application
        run: |
          evidence_dir="$RUNNER_TEMP/spec-resolution-evidence"
          test "$(git rev-parse HEAD)" = 29f5a77069bee0163e3cfebbb6fd5969f23160a1
          git rev-parse HEAD > "$evidence_dir/source-commit.txt"
          java -version > "$evidence_dir/java-version.txt" 2>&1
          sha256sum gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties > "$evidence_dir/wrapper-sha256.txt"
          df -h . > "$evidence_dir/disk-before.txt"
          start_time=$(date +%s)
          set +e
          timeout 600 ./gradlew --no-daemon --console=plain dependencyInsight --dependency springdoc-openapi-webmvc-core --configuration runtimeClasspath > "$evidence_dir/dependency-insight.log" 2>&1
          command_exit=$?
          set -e
          end_time=$(date +%s)
          printf '{"exit_code":%s,"elapsed_seconds":%s,"command_timeout_seconds":600}\n' "$command_exit" "$((end_time-start_time))" > "$evidence_dir/execution.json"
          df -h . > "$evidence_dir/disk-after.txt"
          exit "$command_exit"
      - name: Retain qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: development-spec-resolution-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/spec-resolution-evidence/
          retention-days: 1
          if-no-files-found: warn

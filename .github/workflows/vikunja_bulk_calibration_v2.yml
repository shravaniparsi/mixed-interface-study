name: Vikunja bulk write-preservation calibration v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-manual-applications
  cancel-in-progress: false
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - version: historical
            ref: bbe3dbe0f7cf97e646f3001c380f59ef5c1cda0a
          - version: fixed
            ref: ad018d4e16e8c82ed254376f49d097559524e649
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: go-vikunja/vikunja
          ref: ${{ matrix.ref }}
          path: upstream-vikunja
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: false
      - name: Execute frozen real-route observation
        env:
          STUDY_VERSION: ${{ matrix.version }}
        run: python3 scripts/extension/run_vikunja_bulk_v2.py --source upstream-vikunja --version "$STUDY_VERSION" --output "$RUNNER_TEMP/vikunja-bulk"
      - name: Retain attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vikunja-bulk-v2-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vikunja-bulk/
          retention-days: 7
          if-no-files-found: warn

name: RealWorld generated mutation diagnostic v3
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-manual-applications
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      TZ: UTC
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/study-artifacts" "$RUNNER_TEMP/study-runtime"
          printf 'CI_ARTIFACT_DIR=%s\nSTUDY_RUNTIME=%s\n' "$RUNNER_TEMP/study-artifacts" "$RUNNER_TEMP/study-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Record runtime versions
        run: python scripts/ci/capture_versions.py --output "$CI_ARTIFACT_DIR/runtime-versions.json"
      - name: Install pinned browser
        timeout-minutes: 4
        run: bash scripts/ci/install_browser.sh 2>&1 | tee "$CI_ARTIFACT_DIR/browser-install.log"
      - name: Prepare pinned RealWorld
        timeout-minutes: 6
        run: python scripts/ci/prepare_realworld.py --runtime "$STUDY_RUNTIME/realworld" --node-tools "$RUNNER_TEMP/study-node-tools" --report "$CI_ARTIFACT_DIR/realworld-bootstrap.json" 2>&1 | tee "$CI_ARTIFACT_DIR/application-bootstrap.log"
      - name: Execute bounded generated mutation diagnostic
        timeout-minutes: 32
        run: |
          timeout --signal=TERM --kill-after=20s 1800s python scripts/run_realworld_generated_mutations_v3.py 2>&1 | tee "$CI_ARTIFACT_DIR/application-run.log"
      - name: Independently reconstruct completed or halted diagnostic
        if: ${{ always() }}
        run: python scripts/validate_realworld_generated_mutations_v3.py "$CI_ARTIFACT_DIR/realworld-generated-v3"
      - name: Retain every attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realworld-generated-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/study-artifacts/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

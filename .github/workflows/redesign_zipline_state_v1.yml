name: Redesign Zipline PostgreSQL state restoration v1
on:
  workflow_dispatch:
    inputs:
      freeze:
        description: Published full commit for one ordinary lifecycle attempt
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: redesign-zipline-state-v1
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify frozen inputs
        env:
          FREEZE: ${{ inputs.freeze }}
        run: |
          test "$(git rev-parse HEAD)" = "$FREEZE"
          python3 -c 'import json,hashlib,pathlib; x=json.load(open("manifests/redesign-zipline-state-v1.json")); [(None if hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h else (_ for _ in ()).throw(ValueError(p))) for p,h in x["sha256"].items()]'
          mkdir -p "$RUNNER_TEMP/redesign-zipline-state-v1/evidence" "$RUNNER_TEMP/ordinary-tools"
          printf '%s\n' "$FREEZE" > "$RUNNER_TEMP/redesign-zipline-state-v1/evidence/freeze.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - name: Download exact verified runtime artifact once
        env:
          GH_TOKEN: ${{ github.token }}
          ORDINARY_BASE: ${{ runner.temp }}/redesign-zipline-state-v1
        run: |
          timeout 90s gh api repos/shravaniparsi/mixed-interface-study/actions/artifacts/14624849143/zip > "$ORDINARY_BASE/build.zip"
          python3 development/redesign-zipline-state-v1/prepare.py
      - name: Verify unchanged runtime before execution
        env:
          ORDINARY_BASE: ${{ runner.temp }}/redesign-zipline-state-v1
        run: python3 development/redesign-zipline-state-v1/verify_runtime.py > "$ORDINARY_BASE/evidence/runtime-before.json"
      - name: Install locked browser tools on runner only
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ordinary-browsers
        run: |
          cp development/continuation-fixture-v1/package*.json "$RUNNER_TEMP/ordinary-tools/"
          npm ci --prefix "$RUNNER_TEMP/ordinary-tools" --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/ordinary-tools/node_modules/.bin/playwright" install --with-deps chromium
          node --version > "$RUNNER_TEMP/redesign-zipline-state-v1/evidence/node-version.txt"
          python3 --version > "$RUNNER_TEMP/redesign-zipline-state-v1/evidence/python-version.txt"
      - name: Execute ordinary controls in loopback-only namespace once
        run: |
          timeout --signal=TERM --kill-after=10s 600s sudo env -i PATH="$PATH" ORDINARY_BASE="$RUNNER_TEMP/redesign-zipline-state-v1" PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/ordinary-tools/node_modules/playwright" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ordinary-browsers" NODE_BIN="$(command -v node)" RUN_SCRIPT="$GITHUB_WORKSPACE/development/redesign-zipline-state-v1/run.mjs" unshare --net /bin/bash "$GITHUB_WORKSPACE/development/redesign-zipline-state-v1/execute.sh"
      - name: Verify unchanged runtime after execution
        if: ${{ always() }}
        env:
          ORDINARY_BASE: ${{ runner.temp }}/redesign-zipline-state-v1
        run: python3 development/redesign-zipline-state-v1/verify_runtime.py > "$ORDINARY_BASE/evidence/runtime-after.json"
      - name: Sanitize public evidence
        id: publish
        if: ${{ always() }}
        env:
          ORDINARY_BASE: ${{ runner.temp }}/redesign-zipline-state-v1
        run: sudo --preserve-env=ORDINARY_BASE python3 development/redesign-zipline-state-v1/export.py
      - name: Retain ordinary qualification evidence
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: redesign-zipline-state-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/redesign-zipline-state-v1/public-evidence/
          retention-days: 14
          if-no-files-found: warn

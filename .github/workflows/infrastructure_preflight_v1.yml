name: Infrastructure feasibility preflight v1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20.20.2'
          package-manager-cache: false
      - name: Install unchanged pinned browser with bounded extended deadline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          export CI_ARTIFACT_DIR="$RUNNER_TEMP/evidence"
          uname -a > "$CI_ARTIFACT_DIR/runner.txt"
          timeout --signal=TERM --kill-after=15 600 bash scripts/ci/install_browser.sh 2>&1 | tee "$CI_ARTIFACT_DIR/install.log"
      - name: Native local form smoke check
        run: |
          set -euo pipefail
          export CI_ARTIFACT_DIR="$RUNNER_TEMP/evidence"
          timeout --signal=TERM --kill-after=10 60 node scripts/ci/browser_smoke_v1.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: infrastructure-preflight-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/*
          retention-days: 7
          if-no-files-found: warn

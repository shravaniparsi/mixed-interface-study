name: Historical write preservation calibration v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-manual-applications
  cancel-in-progress: false
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - version: historical
            commit: dea54f939e388ab857d0f4923b27f5793f028e33
          - version: fixed
            commit: 3566bd3f09430ad573a41bc7a4b52725b8be6221
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      STUDY_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: webern/tiller-sync
          ref: ${{ matrix.commit }}
          path: upstream-tiller
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - name: Install schema baseline
        run: python -m pip install jsonschema==4.23.0
      - name: Replay fixed cases
        run: python scripts/extension/run_write_preservation_tiller_v2.py --version "$STUDY_VERSION" --source upstream-tiller --output "$RUNNER_TEMP/write-preservation"
      - name: Retain every attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: write-preservation-calibration-v2-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/write-preservation/
          retention-days: 7
          if-no-files-found: error

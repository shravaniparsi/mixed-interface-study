name: Pinned GitLab image inspection v1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect stopped image without starting services
        run: |
          mkdir -p "$RUNNER_TEMP/gitlab-image-inspection"
          git rev-parse HEAD > "$RUNNER_TEMP/gitlab-image-inspection/head.txt"
          bash scripts/extension/inspect_benchmark_gitlab_image_v1.sh "$RUNNER_TEMP/gitlab-image-inspection"
      - name: Retain inspection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitlab-image-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/gitlab-image-inspection/
          retention-days: 30
